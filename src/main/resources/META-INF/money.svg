<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 金币主体 -->
    <circle cx="20" cy="20" r="18" fill="#FFD700" stroke="#D4AF37" stroke-width="2"/>

    <!-- 金币上的$符号 -->
    <text x="20" y="26" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#8B4513">$</text>

    <!-- 金币边缘装饰 -->
    <circle cx="20" cy="20" r="14" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- 金币反光效果 -->
    <ellipse cx="14" cy="14" rx="4" ry="6" fill="white" opacity="0.3"/>
</svg>
